{{- if .Values.migrations.enabled }}
# Schema migrations run before every install/upgrade (one advisory lock; each file once, see src/app/migrate.py).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "laai.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "laai.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ if .Values.devPostgres.enabled }}post-install,pre-upgrade{{ else }}pre-install,pre-upgrade{{ end }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "laai.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "src.app.migrate"]
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: MIGRATION_DATABASE_URL }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
{{- if .Values.librarySync.enabled }}
---
# Approved clause library -> Postgres (+ TEI embeddings). Hourly, and once after each install/upgrade.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "laai.fullname" . }}-library-sync
  labels:
    {{- include "laai.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.librarySync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: sync
              image: {{ include "laai.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "src.app.sync"]
              env:
                - name: EMBED_URL
                  value: http://{{ include "laai.fullname" . }}-embed
                - name: MIGRATION_DATABASE_URL
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.existingSecret }}, key: MIGRATION_DATABASE_URL }
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "laai.fullname" . }}-library-sync-{{ .Release.Revision }}
  labels:
    {{- include "laai.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sync
          image: {{ include "laai.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "src.app.sync"]
          env:
            - name: EMBED_URL
              value: http://{{ include "laai.fullname" . }}-embed
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: MIGRATION_DATABASE_URL }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
