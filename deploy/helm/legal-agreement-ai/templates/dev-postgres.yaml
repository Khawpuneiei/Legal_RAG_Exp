{{- if .Values.devPostgres.enabled }}
# Development only (kind / minikube). Production uses a managed PostgreSQL with backups and point-in-time recovery.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "laai.fullname" . }}-pg
  labels:
    {{- include "laai.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "laai.fullname" . }}-pg
  replicas: 1
  selector:
    matchLabels:
      {{- include "laai.selector" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "laai.selector" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: {{ .Values.devPostgres.image }}
          env:
            - name: POSTGRES_DB
              value: legal
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD }
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: APP_DB_PASSWORD }
            - name: WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: WORKER_DB_PASSWORD }
          ports:
            - name: pg
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "legal"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: {{ include "laai.fullname" . }}-pg-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.devPostgres.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "laai.fullname" . }}-pg-init
  labels:
    {{- include "laai.labels" . | nindent 4 }}
data:
  10-login-roles.sh: |
{{ .Files.Get "files/10-login-roles.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "laai.fullname" . }}-pg
  labels:
    {{- include "laai.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "laai.selector" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - name: pg
      port: 5432
      targetPort: pg
{{- end }}
